<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="bg" cx="45%" cy="55%" r="80%">
      <stop offset="0" stop-color="#0b1d2f"/>
      <stop offset=".7" stop-color="#050d17"/>
      <stop offset="1" stop-color="#02060b"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103a2c"/>
      <stop offset="1" stop-color="#07211a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6ced6"/>
      <stop offset=".5" stop-color="#8a96a2"/>
      <stop offset="1" stop-color="#5d6873"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- radio waves -->
  <g fill="none" stroke="#40d4ff" stroke-width="4" stroke-linecap="round">
    <path d="M1180 210 a90 90 0 0 1 0 140" opacity=".7"/>
    <path d="M1230 160 a160 160 0 0 1 0 240" opacity=".45"/>
    <path d="M1280 110 a230 230 0 0 1 0 340" opacity=".22"/>
  </g>

  <g transform="rotate(6 760 540)">
    <!-- board -->
    <rect x="330" y="300" width="860" height="500" rx="34" fill="url(#board)" stroke="#2c8a63" stroke-width="3"/>
    <!-- ground guard traces -->
    <rect x="355" y="325" width="810" height="450" rx="22" fill="none" stroke="#c9a24a" stroke-width="5" opacity=".6"/>
    <g fill="#c9a24a" opacity=".55">
      <circle cx="400" cy="350" r="5"/><circle cx="460" cy="350" r="5"/><circle cx="520" cy="350" r="5"/><circle cx="580" cy="350" r="5"/><circle cx="640" cy="350" r="5"/><circle cx="700" cy="350" r="5"/><circle cx="760" cy="350" r="5"/><circle cx="820" cy="350" r="5"/><circle cx="880" cy="350" r="5"/><circle cx="940" cy="350" r="5"/><circle cx="1000" cy="350" r="5"/><circle cx="1060" cy="350" r="5"/><circle cx="1120" cy="350" r="5"/>
      <circle cx="400" cy="750" r="5"/><circle cx="460" cy="750" r="5"/><circle cx="520" cy="750" r="5"/><circle cx="580" cy="750" r="5"/><circle cx="640" cy="750" r="5"/><circle cx="700" cy="750" r="5"/><circle cx="760" cy="750" r="5"/><circle cx="820" cy="750" r="5"/><circle cx="880" cy="750" r="5"/><circle cx="940" cy="750" r="5"/><circle cx="1000" cy="750" r="5"/><circle cx="1060" cy="750" r="5"/><circle cx="1120" cy="750" r="5"/>
    </g>

    <!-- traces -->
    <g fill="none" stroke="#c9a24a" stroke-width="4" stroke-linecap="round" opacity=".8">
      <path d="M700 520 H860"/>
      <path d="M700 560 H780 V650 H880"/>
      <path d="M560 620 V690 H700"/>
      <path d="M1010 520 H1110 V420"/>
      <path d="M560 440 V400 H460"/>
    </g>

    <!-- RF shield / LoRa module -->
    <rect x="860" y="410" width="250" height="210" rx="10" fill="url(#shield)"/>
    <g fill="#6d7984" opacity=".6">
      <circle cx="900" cy="450" r="5"/><circle cx="940" cy="450" r="5"/><circle cx="980" cy="450" r="5"/><circle cx="1020" cy="450" r="5"/><circle cx="1060" cy="450" r="5"/>
      <circle cx="900" cy="490" r="5"/><circle cx="940" cy="490" r="5"/><circle cx="980" cy="490" r="5"/><circle cx="1020" cy="490" r="5"/><circle cx="1060" cy="490" r="5"/>
    </g>
    <text x="985" y="575" text-anchor="middle" font-family="monospace" font-size="24" fill="#3a444e" letter-spacing="3">868 MHz</text>

    <!-- antenna -->
    <rect x="1100" y="380" width="30" height="40" fill="#c9a24a"/>
    <rect x="1104" y="170" width="22" height="215" rx="11" fill="#1b232c" stroke="#3a4856" stroke-width="2"/>

    <!-- MCU -->
    <rect x="560" y="440" width="140" height="180" rx="8" fill="#141c25" stroke="#2f4152" stroke-width="2"/>
    <text x="630" y="535" text-anchor="middle" font-family="monospace" font-size="18" fill="#4f6a80" letter-spacing="2">MCU</text>

    <!-- power gate -->
    <rect x="420" y="460" width="90" height="60" rx="6" fill="#141c25" stroke="#2f4152" stroke-width="2"/>
    <rect x="420" y="560" width="90" height="60" rx="6" fill="#141c25" stroke="#2f4152" stroke-width="2"/>

    <!-- battery connector -->
    <rect x="400" y="660" width="140" height="70" rx="6" fill="#e6e1d3"/>
    <rect x="420" y="680" width="40" height="30" fill="#b9b2a0"/><rect x="480" y="680" width="40" height="30" fill="#b9b2a0"/>

    <!-- LEDs -->
    <circle cx="820" cy="700" r="30" fill="#5cff9d" filter="url(#glow)"/>
    <circle cx="820" cy="700" r="10" fill="#eafff2"/>
    <circle cx="900" cy="700" r="30" fill="#40d4ff" filter="url(#glow)"/>
    <circle cx="900" cy="700" r="10" fill="#e3f9ff"/>
    <circle cx="980" cy="700" r="24" fill="#ffb347" filter="url(#glow)" opacity=".7"/>
    <circle cx="980" cy="700" r="8" fill="#fff3e0"/>
  </g>

  <g font-family="monospace" fill="#5fc9ee" opacity=".7">
    <text x="120" y="160" font-size="22" letter-spacing="3">NODE AURA-07</text>
    <text x="120" y="196" font-size="18" letter-spacing="3" fill="#5cff9d">SLEEP 14 µA  ● LINK</text>
  </g>
</svg>
